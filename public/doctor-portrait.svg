<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-label="Portrait placeholder of Dr. Saloni Gupta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e3a3a"/>
      <stop offset="1" stop-color="#0a1b2a"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eef0"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d3bf"/>
      <stop offset="1" stop-color="#e0b89e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#bg)"/>
  <circle cx="450" cy="380" r="360" fill="url(#glow)"/>
  <!-- shoulders / white coat -->
  <path d="M170 1100 C190 850 300 760 450 760 C600 760 710 850 730 1100 Z" fill="url(#coat)"/>
  <path d="M450 770 l46 120 l-46 60 l-46 -60 Z" fill="#dbe7ea"/>
  <!-- neck -->
  <rect x="404" y="640" width="92" height="150" rx="40" fill="url(#skin)"/>
  <!-- head -->
  <circle cx="450" cy="470" r="180" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M268 470 C250 320 360 250 450 250 C540 250 650 320 632 470 C618 380 540 330 450 330 C360 330 282 380 268 470 Z" fill="#2a2530"/>
  <path d="M268 470 C262 560 270 620 300 700 C250 600 250 470 290 400 Z" fill="#2a2530"/>
  <path d="M632 470 C638 560 630 620 600 700 C650 600 650 470 610 400 Z" fill="#2a2530"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#ffffff">
    <text x="450" y="980" font-size="40" text-anchor="middle" font-weight="800">Dr. Saloni Gupta</text>
    <text x="450" y="1028" font-size="24" text-anchor="middle" opacity="0.7">Oral &amp; Maxillofacial Surgeon</text>
  </g>
  <text x="450" y="1072" font-size="18" text-anchor="middle" fill="#9fb0b8" font-family="system-ui, sans-serif">Portrait placeholder — replace with a real photo</text>
