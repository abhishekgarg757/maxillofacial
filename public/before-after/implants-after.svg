      <stop offset="0" stop-color="#e7f6f3"/>
      <stop offset="1" stop-color="#cdeee7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="650" cy="150" r="240" fill="#ffffff" opacity="0.35"/>
