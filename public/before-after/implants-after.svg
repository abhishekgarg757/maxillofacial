      <rect x="-58" y="2" width="52" height="92" rx="10"/>
      <rect x="6" y="2" width="52" height="92" rx="10"/>
      <rect x="66" y="2" width="52" height="92" rx="10"/>
      <rect x="128" y="-6" width="52" height="86" rx="10"/>
