<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Illustrative smile before dental implant (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f4"/>
      <stop offset="1" stop-color="#dbe5ea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="650" cy="150" r="240" fill="#ffffff" opacity="0.3"/>
  <!-- stylized smile with a missing tooth -->
  <g transform="translate(400 430)">
    <path d="M-220 -40 C-150 60 150 60 220 -40 C150 150 -150 150 -220 -40 Z" fill="#8a4b4b"/>
    <g fill="#ffffff">
      <rect x="-180" y="-20" width="52" height="70" rx="10"/>
      <rect x="-120" y="-6" width="52" height="86" rx="10"/>
      <rect x="-58" y="2" width="52" height="92" rx="10"/>
      <!-- gap here (missing tooth) -->
      <rect x="66" y="2" width="52" height="92" rx="10"/>
      <rect x="128" y="-6" width="52" height="86" rx="10"/>
    </g>
    <rect x="6" y="6" width="52" height="92" rx="10" fill="#5f3535"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="44" y="44" width="178" height="54" rx="27" fill="#0f172a" opacity="0.88"/>
    <text x="133" y="80" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="800" letter-spacing="1">BEFORE</text>
    <text x="44" y="710" font-size="30" fill="#0f172a" opacity="0.85" font-weight="700">Restored smile</text>
    <text x="44" y="746" font-size="20" fill="#0f172a" opacity="0.5">Illustrative placeholder — not a real patient</text>
  </g>
</svg>
