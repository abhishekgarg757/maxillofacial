<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Illustrative portrait before facial trauma repair (placeholder)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f4"/>
      <stop offset="1" stop-color="#dbe5ea"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4bd"/>
      <stop offset="1" stop-color="#7d97a2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <circle cx="650" cy="150" r="240" fill="#ffffff" opacity="0.3"/>
  <g transform="translate(400 480)">
    <path d="M-250 240 C-250 70 -150 -10 0 -10 C150 -10 250 70 250 240 Z" fill="url(#head)"/>
    <circle cx="0" cy="-150" r="146" fill="url(#head)"/>
    <!-- subtle asymmetry indicator on one cheek -->
    <path d="M70 -150 q40 30 0 70" fill="none" stroke="#5f7681" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="44" y="44" width="178" height="54" rx="27" fill="#0f172a" opacity="0.88"/>
    <text x="133" y="80" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="800" letter-spacing="1">BEFORE</text>
    <text x="44" y="710" font-size="30" fill="#0f172a" opacity="0.85" font-weight="700">Facial symmetry</text>
    <text x="44" y="746" font-size="20" fill="#0f172a" opacity="0.5">Illustrative placeholder — not a real patient</text>
  </g>
</svg>
